---
name: Sync upstream

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync hassio-addons/app-nut
    runs-on: ubuntu-latest

    steps:
      - name: ⤵️ Check out fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔄 Fetch upstream
        run: |
          git remote add upstream https://github.com/hassio-addons/app-nut.git
          git fetch upstream main
          git fetch origin main
          git fetch origin sync-upstream:refs/remotes/origin/sync-upstream || true

      - name: 🧭 Determine whether sync is needed
        id: check
        run: |
          base="$(cat .upstream-main-sha 2>/dev/null || true)"
          upstream="$(git rev-parse upstream/main)"

          if [[ -z "${base}" ]]; then
            echo "::error::.upstream-main-sha is missing or empty."
            exit 1
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::Recorded upstream commit ${base} is not available."
            exit 1
          fi

          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"

          if [[ "${base}" == "${upstream}" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "workflow_changes=false" >> "$GITHUB_OUTPUT"
            echo "Fork already contains the current upstream main."
            exit 0
          fi

          if git diff --quiet "${base}" "${upstream}" -- .github/workflows; then
            echo "workflow_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_changes=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Upstream workflow files changed. They will not be imported automatically."
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: 🌿 Build sync branch
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.check.outputs.base }}
          UPSTREAM: ${{ steps.check.outputs.upstream }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B sync-upstream origin/main

          if ! git diff --binary "${BASE}" "${UPSTREAM}" -- .             ':(exclude).github/workflows/**' | git apply --index --3way; then
            echo "::error::Upstream application changes conflict with fork-specific changes."
            git status --short
            exit 1
          fi

          printf '%s\n' "${UPSTREAM}" > .upstream-main-sha
          git add .upstream-main-sha

          git commit -m "Sync upstream hassio-addons/app-nut"

          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}"             push --force-with-lease origin sync-upstream

      - name: 🔀 Open or reuse sync pull request
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_CHANGES: ${{ steps.check.outputs.workflow_changes }}
        run: |
          body="Automated sync of application/build changes from `hassio-addons/app-nut:main`. CI must pass before this PR is merged."

          if [[ "${WORKFLOW_CHANGES}" == "true" ]]; then
            body="${body}

          ⚠️ Upstream also changed files under `.github/workflows/`. Those privileged files are intentionally not imported automatically and should be reviewed separately."
          fi

          if gh pr view sync-upstream --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh pr edit sync-upstream               --repo "${GITHUB_REPOSITORY}"               --body "${body}"
            echo "Updated existing sync pull request."
          else
            gh pr create               --repo "${GITHUB_REPOSITORY}"               --base main               --head sync-upstream               --title "Sync upstream hassio-addons/app-nut"               --body "${body}"
          fi
